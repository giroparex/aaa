                    <button onclick="toggleAllCheckboxes()" class="text-xs font-semibold text-primary flex items-center">

            <section>
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-widest mb-4">Observaciones</h2>

                <span class="material-icons">save</span>

    <script>
        const GITHUB_USER = "giroparex";
        const GITHUB_REPO = "gestor-estudiantes";
        const FILE_PATH = "alumnos.json";
        const JSON_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${FILE_PATH}?t=${Date.now()}`;
        
        const daysNames = ['DOM', 'LUN', 'MAR', 'MIÉ', 'JUE', 'VIE', 'SÁB'];
        const monthsNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        function setupCalendar() {
            const container = document.getElementById('calendar-container');
            const dateText = document.getElementById('current-date-text');
            const now = new Date();
            dateText.innerText = `Hoy: ${now.getDate()} de ${monthsNames[now.getMonth()]}`;

            const dayOfWeek = now.getDay();
            const diffToMonday = now.getDate() - dayOfWeek + (dayOfWeek === 0 ? -6 : 1);
            const monday = new Date(new Date().setDate(diffToMonday));

            container.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(monday);
                dayDate.setDate(monday.getDate() + i);
                const isToday = dayDate.toDateString() === new Date().toDateString();
                
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-16 h-20 rounded-2xl border flex flex-col items-center justify-center space-y-1 transition-all ${isToday ? 'bg-primary border-primary text-white shadow-lg scale-110 mx-2 z-10' : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 text-slate-800 dark:text-slate-100'}`;
                if ((dayDate.getDay() === 0 || dayDate.getDay() === 6) && !isToday) btn.style.opacity = "0.5";

                btn.innerHTML = `<span class="text-[10px] font-bold ${isToday ? 'opacity-90' : 'text-slate-400'}">${daysNames[dayDate.getDay()]}</span><span class="text-lg font-bold">${dayDate.getDate()}</span>`;
                container.appendChild(btn);
            }
        }

        async function fetchStudents() {
            try {
                const response = await fetch(JSON_URL);
                const allStudents = await response.json();
                
                // FILTRAR: Solo alumnos del curso actual (LUNES A VIERNES)
                const filtered = allStudents.filter(s => s.course === "INTENSIVO 2");
                
                renderStudents(filtered);
            } catch (error) {
                console.error(error);
                document.getElementById('student-list').innerHTML = `<p class="text-center text-slate-500 py-10">Error cargando alumnos de GitHub.</p>`;
            }
        }

        function renderStudents(students) {
            const list = document.getElementById('student-list');
            document.getElementById('student-count').innerText = `Alumnos Inscritos (${students.length})`;
            list.innerHTML = '';

            students.forEach(s => {
                const card = document.createElement('div');
                card.className = "p-4 bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between shadow-sm";
                
                // Usar foto del JSON o un placeholder con el nombre
                const fotoSrc = s.photo || `https://ui-avatars.com/api/?name=${encodeURIComponent(s.name)}&background=random`;
                
                card.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full bg-slate-200 overflow-hidden border">
                            <img class="w-full h-full object-cover" src="${fotoSrc}" alt="Avatar">
                        </div>
                        <div>
                            <p class="font-semibold text-sm">${s.name || 'Sin nombre'}</p>
                            <p class="text-[10px] text-slate-400">${s.phone1 || 'Sin teléfono'}</p>
                        </div>
                    </div>
                    <input type="checkbox" data-id="${s.id}" class="student-checkbox w-6 h-6 rounded-full text-primary focus:ring-primary border-slate-300 dark:border-slate-700">
                `;
                list.appendChild(card);
            });
        }

        function toggleAllCheckboxes() {
            const checks = document.querySelectorAll('.student-checkbox');
            const allChecked = Array.from(checks).every(c => c.checked);
            checks.forEach(c => c.checked = !allChecked);
        }

        function guardarAsistencia() {
            const data = {
                fecha: new Date().toLocaleDateString(),
                asistentes: Array.from(document.querySelectorAll('.student-checkbox:checked')).map(cb => cb.dataset.id),
                notas: document.getElementById('daily-notes').value
            };
            console.log("Guardando sesión:", data);
            alert("Asistencia guardada localmente.\nPara guardar en GitHub se requiere integración con API.");
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupCalendar();
            fetchStudents();
        });
    </script>
